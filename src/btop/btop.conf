# Claves de btop que pone el tema Bliss. NO es un btop.conf completo: la
# herramienta solo escribe estas y deja intacto el resto, que btop rellena
# solo con sus valores por defecto.
#
# La clave para 16 colores es force_tty, no tty_mode. tty_mode aparece en
# `btop --help` como nombre del argumento largo (+t/--tty_off), pero en el
# fichero no existe: btop la descarta en silencio al reescribir la config.
# Comprobado: con force_tty activo la salida no lleva ni un codigo de 24
# bits ni de 256, solo los dieciseis ANSI.

# Tema de 16 colores que btop trae integrado.
color_theme = "TTY"

# Que no pinte su propio fondo: asi se ve el negro del terminal.
theme_background = False

# Sin 24 bits. Sin esto, el tema TTY se seguiria convirtiendo a 256.
truecolor = False

# Simbolos de grafico sencillos, de los que se veian en una consola.
force_tty = True

# Esquinas rectas, como el resto del tema.
rounded_corners = False
