<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bliss Dark (GENERADO por tools/make-dark-aurorae.py) — help.svg
  Boton opcional de Aurorae. Solo aparece si el usuario anade este boton en
  Preferencias del sistema > Decoracion de ventanas. Prefijos de ID:
  active-center (obligatorio), hover-center, pressed-center, inactive-center.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="21" height="96" viewBox="0 0 21 96" version="1.1">
  <defs>
    <linearGradient id="g-active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c99fa"/>
      <stop offset="1" stop-color="#0b46a4"/>
    </linearGradient>
    <linearGradient id="g-hover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aaffd"/>
      <stop offset="1" stop-color="#1c5cbe"/>
    </linearGradient>
    <linearGradient id="g-pressed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#093c8f"/>
      <stop offset="1" stop-color="#1d71e0"/>
    </linearGradient>
    <linearGradient id="g-inactive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ca8e2"/>
      <stop offset="1" stop-color="#5883cd"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
  </defs>
  <g id="active-center">
    <rect x="0.5" y="0.5" width="20" height="20" rx="3" fill="url(#g-active)" stroke="#08347b" stroke-width="1"/>
    <rect x="2" y="2" width="17" height="8" rx="2" fill="url(#gloss)"/>
    <path d="M 7.6,8 A 2.9,2.9 0 1 1 10.5,11.6 V 13.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="10.5" cy="16" r="1.2" fill="#ffffff"/>
  </g>
  <g id="hover-center">
    <rect x="0.5" y="25.5" width="20" height="20" rx="3" fill="url(#g-hover)" stroke="#08347b" stroke-width="1"/>
    <rect x="2" y="27" width="17" height="8" rx="2" fill="url(#gloss)"/>
    <path d="M 7.6,33 A 2.9,2.9 0 1 1 10.5,36.6 V 38.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="10.5" cy="41" r="1.2" fill="#ffffff"/>
  </g>
  <g id="pressed-center">
    <rect x="0.5" y="50.5" width="20" height="20" rx="3" fill="url(#g-pressed)" stroke="#072b5e" stroke-width="1"/>
    <rect x="2" y="52" width="17" height="8" rx="2" fill="url(#gloss)"/>
    <path d="M 7.6,58 A 2.9,2.9 0 1 1 10.5,61.6 V 63.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="10.5" cy="66" r="1.2" fill="#ffffff"/>
  </g>
  <g id="inactive-center">
    <rect x="0.5" y="75.5" width="20" height="20" rx="3" fill="url(#g-inactive)" stroke="#5274b7" stroke-width="1"/>
    <rect x="2" y="77" width="17" height="8" rx="2" fill="url(#gloss)"/>
    <path d="M 7.6,83 A 2.9,2.9 0 1 1 10.5,86.6 V 88.2" fill="none" stroke="#9ebef4" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="10.5" cy="91" r="1.2" fill="#9ebef4"/>
  </g>
</svg>
