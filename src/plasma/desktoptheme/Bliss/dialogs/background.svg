<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bliss — dialogs/background.svg   (fondo de popups y del menu Inicio)

  Aqui el prefijo es VACIO: los ids son topleft, top, center, ... sin mas.
  El prefijo "mask" define la region opaca, que es lo que redondea de verdad
  las esquinas.

  Va azul oscuro, no claro, por una razon que no es estetica: el contenido del
  panel se pinta con [Colors:Window] del Plasma style, y ese grupo tiene que
  ser claro-sobre-oscuro para que los iconos de la bandeja se vean sobre la
  barra azul. Plasma no permite dar un grupo de color distinto al panel y a
  los popups, asi que todo el chrome comparte paleta. El menu Inicio claro de
  XP necesitaria un plasmoide propio; ver docs/roadmap.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="42" height="140"
     viewBox="0 0 42 140" version="1.1">
  <defs>
    <linearGradient id="g-dialog" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#2E5FA8"/>
      <stop offset="1" stop-color="#1C3F7A"/>
    </linearGradient>
  </defs>
  <!--  -->
  <g id="topleft">
    <path d="M 0,5 A 5,5 0 0 1 5,0 L 8,0 L 8,8 L 0,8 Z" fill="url(#g-dialog)"/>
    <path d="M 0.5,8 L 0.5,5 A 5,5 0 0 1 5,0.5 L 8,0.5" fill="none" stroke="#0E2F72" stroke-width="1"/>
    <path d="M 1.5,8 L 1.5,5 A 5,5 0 0 1 5,1.5 L 8,1.5" fill="none" stroke="#6BA6F8" stroke-width="1"/>
  </g>
  <g id="top">
    <rect x="8" y="0" width="16" height="8" fill="url(#g-dialog)"/>
    <rect x="8" y="0" width="16" height="1" fill="#0E2F72"/>
    <rect x="8" y="1" width="16" height="1" fill="#6BA6F8"/>
  </g>
  <g id="topright">
    <path d="M 24,0 L 27,0 A 5,5 0 0 1 32,5 L 32,8 L 24,8 Z" fill="url(#g-dialog)"/>
    <path d="M 24,0.5 L 27,0.5 A 5,5 0 0 1 31.5,5 L 31.5,8" fill="none" stroke="#0E2F72" stroke-width="1"/>
    <path d="M 24,1.5 L 27,1.5 A 5,5 0 0 1 30.5,5 L 30.5,8" fill="none" stroke="#6BA6F8" stroke-width="1"/>
  </g>
  <g id="left">
    <rect x="0" y="8" width="8" height="16" fill="url(#g-dialog)"/>
    <rect x="0" y="8" width="1" height="16" fill="#0E2F72"/>
    <rect x="1" y="8" width="1" height="16" fill="#6BA6F8"/>
  </g>
  <rect id="center" x="8" y="8" width="16" height="16" fill="url(#g-dialog)"/>
  <g id="right">
    <rect x="24" y="8" width="8" height="16" fill="url(#g-dialog)"/>
    <rect x="31" y="8" width="1" height="16" fill="#0E2F72"/>
    <rect x="30" y="8" width="1" height="16" fill="#6BA6F8"/>
  </g>
  <g id="bottomleft">
    <path d="M 0,24 L 8,24 L 8,32 L 5,32 A 5,5 0 0 1 0,27 Z" fill="url(#g-dialog)"/>
    <path d="M 0.5,24 L 0.5,27 A 5,5 0 0 0 5,31.5 L 8,31.5" fill="none" stroke="#0E2F72" stroke-width="1"/>
  </g>
  <g id="bottom">
    <rect x="8" y="24" width="16" height="8" fill="url(#g-dialog)"/>
    <rect x="8" y="31" width="16" height="1" fill="#0E2F72"/>
  </g>
  <g id="bottomright">
    <path d="M 24,24 L 32,24 L 32,27 A 5,5 0 0 1 27,32 L 24,32 Z" fill="url(#g-dialog)"/>
    <path d="M 24,31.5 L 27,31.5 A 5,5 0 0 0 31.5,27 L 31.5,24" fill="none" stroke="#0E2F72" stroke-width="1"/>
  </g>
  <!-- mask -->
  <g id="mask-topleft">
    <path d="M 0,105 A 5,5 0 0 1 5,100 L 8,100 L 8,108 L 0,108 Z" fill="#ffffff"/>
  </g>
  <g id="mask-top">
    <rect x="8" y="100" width="16" height="8" fill="#ffffff"/>
  </g>
  <g id="mask-topright">
    <path d="M 24,100 L 27,100 A 5,5 0 0 1 32,105 L 32,108 L 24,108 Z" fill="#ffffff"/>
  </g>
  <g id="mask-left">
    <rect x="0" y="108" width="8" height="16" fill="#ffffff"/>
  </g>
  <rect id="mask-center" x="8" y="108" width="16" height="16" fill="#ffffff"/>
  <g id="mask-right">
    <rect x="24" y="108" width="8" height="16" fill="#ffffff"/>
  </g>
  <g id="mask-bottomleft">
    <path d="M 0,124 L 8,124 L 8,132 L 5,132 A 5,5 0 0 1 0,127 Z" fill="#ffffff"/>
  </g>
  <g id="mask-bottom">
    <rect x="8" y="124" width="16" height="8" fill="#ffffff"/>
  </g>
  <g id="mask-bottomright">
    <path d="M 24,124 L 32,124 L 32,127 A 5,5 0 0 1 27,132 L 24,132 Z" fill="#ffffff"/>
  </g>

  <rect id="hint-top-margin"    x="36" y="0"  width="1" height="6" fill="none"/>
  <rect id="hint-bottom-margin" x="36" y="8"  width="1" height="6" fill="none"/>
  <rect id="hint-left-margin"   x="36" y="16" width="6" height="1" fill="none"/>
  <rect id="hint-right-margin"  x="36" y="20" width="6" height="1" fill="none"/>
</svg>
