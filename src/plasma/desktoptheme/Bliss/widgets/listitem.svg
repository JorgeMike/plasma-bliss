<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bliss — widgets/listitem.svg   (filas de listas y del menu Inicio)

  Prefijos: normal (transparente: las filas en reposo no llevan fondo),
  hover, pressed, section (cabecera de grupo) y separator.

  El texto NO se tiñe aqui: su color sale de colors, grupo [Colors:Window].
  Por eso el hover es azul CLARO — sobre el azul oscuro del popup tiene que
  contrastar, y el #316AC5 de Luna se perderia contra el fondo.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="34" height="200"
     viewBox="0 0 34 200" version="1.1">
  <defs>
    <linearGradient id="g-hover" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="64">
      <stop offset="0" stop-color="#6BA6F8"/>
      <stop offset="1" stop-color="#3C81F3"/>
    </linearGradient>
    <linearGradient id="g-pressed" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="104">
      <stop offset="0" stop-color="#2F6ABF"/>
      <stop offset="1" stop-color="#1C4489"/>
    </linearGradient>
    <linearGradient id="g-section" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="144">
      <stop offset="0" stop-color="#1C3F7A"/>
      <stop offset="1" stop-color="#16325F"/>
    </linearGradient>
    <linearGradient id="g-separator" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="184">
      <stop offset="0" stop-color="#4A7FD4"/>
      <stop offset="1" stop-color="#4A7FD4"/>
    </linearGradient>
  </defs>
  <!-- normal -->
  <g id="normal-topleft">
    <path d="M 0,2 A 2,2 0 0 1 2,0 L 4,0 L 4,4 L 0,4 Z" fill="none"/>
  </g>
  <g id="normal-top">
    <rect x="4" y="0" width="16" height="4" fill="none"/>
  </g>
  <g id="normal-topright">
    <path d="M 20,0 L 22,0 A 2,2 0 0 1 24,2 L 24,4 L 20,4 Z" fill="none"/>
  </g>
  <g id="normal-left">
    <rect x="0" y="4" width="4" height="16" fill="none"/>
  </g>
  <rect id="normal-center" x="4" y="4" width="16" height="16" fill="none"/>
  <g id="normal-right">
    <rect x="20" y="4" width="4" height="16" fill="none"/>
  </g>
  <g id="normal-bottomleft">
    <path d="M 0,20 L 4,20 L 4,24 L 2,24 A 2,2 0 0 1 0,22 Z" fill="none"/>
  </g>
  <g id="normal-bottom">
    <rect x="4" y="20" width="16" height="4" fill="none"/>
  </g>
  <g id="normal-bottomright">
    <path d="M 20,20 L 24,20 L 24,22 A 2,2 0 0 1 22,24 L 20,24 Z" fill="none"/>
  </g>
  <!-- hover -->
  <g id="hover-topleft">
    <path d="M 0,42 A 2,2 0 0 1 2,40 L 4,40 L 4,44 L 0,44 Z" fill="url(#g-hover)"/>
    <path d="M 0.5,44 L 0.5,42 A 2,2 0 0 1 2,40.5 L 4,40.5" fill="none" stroke="#1F4F9E" stroke-width="1"/>
    <path d="M 1.5,44 L 1.5,42 A 2,2 0 0 1 2,41.5 L 4,41.5" fill="none" stroke="#9CC6FC" stroke-width="1"/>
  </g>
  <g id="hover-top">
    <rect x="4" y="40" width="16" height="4" fill="url(#g-hover)"/>
    <rect x="4" y="40" width="16" height="1" fill="#1F4F9E"/>
    <rect x="4" y="41" width="16" height="1" fill="#9CC6FC"/>
  </g>
  <g id="hover-topright">
    <path d="M 20,40 L 22,40 A 2,2 0 0 1 24,42 L 24,44 L 20,44 Z" fill="url(#g-hover)"/>
    <path d="M 20,40.5 L 22,40.5 A 2,2 0 0 1 23.5,42 L 23.5,44" fill="none" stroke="#1F4F9E" stroke-width="1"/>
    <path d="M 20,41.5 L 22,41.5 A 2,2 0 0 1 22.5,42 L 22.5,44" fill="none" stroke="#9CC6FC" stroke-width="1"/>
  </g>
  <g id="hover-left">
