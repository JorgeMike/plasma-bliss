    <rect x="0" y="44" width="1" height="16" fill="#1F4F9E"/>
    <rect x="1" y="44" width="1" height="16" fill="#9CC6FC"/>
  </g>
  <rect id="hover-center" x="4" y="44" width="16" height="16" fill="url(#g-hover)"/>
  <g id="hover-right">
    <rect x="20" y="44" width="4" height="16" fill="url(#g-hover)"/>
    <rect x="23" y="44" width="1" height="16" fill="#1F4F9E"/>
    <rect x="22" y="44" width="1" height="16" fill="#9CC6FC"/>
  </g>
  <g id="hover-bottomleft">
    <path d="M 0,60 L 4,60 L 4,64 L 2,64 A 2,2 0 0 1 0,62 Z" fill="url(#g-hover)"/>
    <path d="M 0.5,60 L 0.5,62 A 2,2 0 0 0 2,63.5 L 4,63.5" fill="none" stroke="#1F4F9E" stroke-width="1"/>
  </g>
  <g id="hover-bottom">
    <rect x="4" y="60" width="16" height="4" fill="url(#g-hover)"/>
    <rect x="4" y="63" width="16" height="1" fill="#1F4F9E"/>
  </g>
  <g id="hover-bottomright">
    <path d="M 20,60 L 24,60 L 24,62 A 2,2 0 0 1 22,64 L 20,64 Z" fill="url(#g-hover)"/>
    <path d="M 20,63.5 L 22,63.5 A 2,2 0 0 0 23.5,62 L 23.5,60" fill="none" stroke="#1F4F9E" stroke-width="1"/>
  </g>
  <!-- pressed -->
  <g id="pressed-topleft">
    <path d="M 0,82 A 2,2 0 0 1 2,80 L 4,80 L 4,84 L 0,84 Z" fill="url(#g-pressed)"/>
    <path d="M 0.5,84 L 0.5,82 A 2,2 0 0 1 2,80.5 L 4,80.5" fill="none" stroke="#0E2F72" stroke-width="1"/>
  </g>
  <g id="pressed-top">
    <rect x="4" y="80" width="16" height="4" fill="url(#g-pressed)"/>
    <rect x="4" y="80" width="16" height="1" fill="#0E2F72"/>
  </g>
  <g id="pressed-topright">
    <path d="M 20,80 L 22,80 A 2,2 0 0 1 24,82 L 24,84 L 20,84 Z" fill="url(#g-pressed)"/>
    <path d="M 20,80.5 L 22,80.5 A 2,2 0 0 1 23.5,82 L 23.5,84" fill="none" stroke="#0E2F72" stroke-width="1"/>
  </g>
  <g id="pressed-left">
    <rect x="0" y="84" width="4" height="16" fill="url(#g-pressed)"/>
    <rect x="0" y="84" width="1" height="16" fill="#0E2F72"/>
  </g>
  <rect id="pressed-center" x="4" y="84" width="16" height="16" fill="url(#g-pressed)"/>
  <g id="pressed-right">
    <rect x="20" y="84" width="4" height="16" fill="url(#g-pressed)"/>
    <rect x="23" y="84" width="1" height="16" fill="#0E2F72"/>
  </g>
  <g id="pressed-bottomleft">
    <path d="M 0,100 L 4,100 L 4,104 L 2,104 A 2,2 0 0 1 0,102 Z" fill="url(#g-pressed)"/>
    <path d="M 0.5,100 L 0.5,102 A 2,2 0 0 0 2,103.5 L 4,103.5" fill="none" stroke="#0E2F72" stroke-width="1"/>
  </g>
  <g id="pressed-bottom">
    <rect x="4" y="100" width="16" height="4" fill="url(#g-pressed)"/>
    <rect x="4" y="103" width="16" height="1" fill="#0E2F72"/>
  </g>
  <g id="pressed-bottomright">
    <path d="M 20,100 L 24,100 L 24,102 A 2,2 0 0 1 22,104 L 20,104 Z" fill="url(#g-pressed)"/>
    <path d="M 20,103.5 L 22,103.5 A 2,2 0 0 0 23.5,102 L 23.5,100" fill="none" stroke="#0E2F72" stroke-width="1"/>
  </g>
  <!-- section -->
  <g id="section-topleft">
    <path d="M 0,122 A 2,2 0 0 1 2,120 L 4,120 L 4,124 L 0,124 Z" fill="url(#g-section)"/>
  </g>
  <g id="section-top">
    <rect x="4" y="120" width="16" height="4" fill="url(#g-section)"/>
  </g>
  <g id="section-topright">
    <path d="M 20,120 L 22,120 A 2,2 0 0 1 24,122 L 24,124 L 20,124 Z" fill="url(#g-section)"/>
  </g>
  <g id="section-left">
    <rect x="0" y="124" width="4" height="16" fill="url(#g-section)"/>
  </g>
  <rect id="section-center" x="4" y="124" width="16" height="16" fill="url(#g-section)"/>
  <g id="section-right">
    <rect x="20" y="124" width="4" height="16" fill="url(#g-section)"/>
  </g>
  <g id="section-bottomleft">
    <path d="M 0,140 L 4,140 L 4,144 L 2,144 A 2,2 0 0 1 0,142 Z" fill="url(#g-section)"/>
  </g>
  <g id="section-bottom">
    <rect x="4" y="140" width="16" height="4" fill="url(#g-section)"/>
  </g>
  <g id="section-bottomright">
    <path d="M 20,140 L 24,140 L 24,142 A 2,2 0 0 1 22,144 L 20,144 Z" fill="url(#g-section)"/>
  </g>
  <!-- separator -->
  <g id="separator-topleft">
    <path d="M 0,162 A 2,2 0 0 1 2,160 L 4,160 L 4,164 L 0,164 Z" fill="url(#g-separator)"/>
  </g>
  <g id="separator-top">
    <rect x="4" y="160" width="16" height="4" fill="url(#g-separator)"/>
  </g>
  <g id="separator-topright">
    <path d="M 20,160 L 22,160 A 2,2 0 0 1 24,162 L 24,164 L 20,164 Z" fill="url(#g-separator)"/>
  </g>
  <g id="separator-left">
    <rect x="0" y="164" width="4" height="16" fill="url(#g-separator)"/>
  </g>
  <rect id="separator-center" x="4" y="164" width="16" height="16" fill="url(#g-separator)"/>
  <g id="separator-right">
    <rect x="20" y="164" width="4" height="16" fill="url(#g-separator)"/>
  </g>
  <g id="separator-bottomleft">
    <path d="M 0,180 L 4,180 L 4,184 L 2,184 A 2,2 0 0 1 0,182 Z" fill="url(#g-separator)"/>
  </g>
  <g id="separator-bottom">
    <rect x="4" y="180" width="16" height="4" fill="url(#g-separator)"/>
  </g>
  <g id="separator-bottomright">
    <path d="M 20,180 L 24,180 L 24,182 A 2,2 0 0 1 22,184 L 20,184 Z" fill="url(#g-separator)"/>
  </g>

  <rect id="normal-hint-top-margin"     x="28" y="0"  width="1" height="2" fill="none"/>
  <rect id="normal-hint-bottom-margin"  x="28" y="4"  width="1" height="2" fill="none"/>
  <rect id="normal-hint-left-margin"    x="28" y="8"  width="3" height="1" fill="none"/>
  <rect id="normal-hint-right-margin"   x="28" y="12" width="3" height="1" fill="none"/>
  <rect id="pressed-hint-top-margin"    x="28" y="16" width="1" height="2" fill="none"/>
  <rect id="pressed-hint-bottom-margin" x="28" y="20" width="1" height="2" fill="none"/>
  <rect id="pressed-hint-left-margin"   x="28" y="24" width="3" height="1" fill="none"/>
  <rect id="pressed-hint-right-margin"  x="28" y="28" width="3" height="1" fill="none"/>
  <!-- Sin esto, KSvg EMBALDOSA las piezas de borde en vez de estirarlas, y
       un degradado en los laterales se repite: en los botones de la barra
       se veian dos ciclos del degradado por boton, como franjas. Basta con
       que el elemento exista; no se dibuja. Lo usan tambien los SVG de
       Breeze (background, plasmoidheading, switch...). -->
  <rect id="hint-stretch-borders" x="0" y="0" width="1" height="1" fill="none"/>
</svg>
