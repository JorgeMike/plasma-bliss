<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bliss — widgets/tasks.svg   (botones de ventana en la barra de tareas)

  Prefijos que pide org.kde.plasma.taskmanager:
    normal · hover · focus (ventana activa) · minimized · attention
    launcher-hover (iconos anclados al pasar el raton)
  Cada uno con las nueve partes del 9-slice.

  No hacen falta las variantes north-/east-/west-: taskPrefix() de
  contents/ui/code/tools.js devuelve ["south-<p>", "<p>"] y Plasma usa la
  primera que exista, asi que el prefijo sin direccion sirve para los cuatro
  bordes del panel. Verificado en el codigo del plasmoide.

  El prefijo vacio (fondo de los lanzadores en reposo) se omite a proposito:
  en XP los iconos de inicio rapido no tienen marco.

  Los degradados son userSpaceOnUse para que el degradado vertical siga
  continuo al partirse en las nueve piezas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="34" height="240"
     viewBox="0 0 34 240" version="1.1">
  <defs>
    <linearGradient id="g-normal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24">
      <stop offset="0" stop-color="#3F86F0"/>
      <stop offset="1" stop-color="#2A63D4"/>
    </linearGradient>
    <linearGradient id="g-hover" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="64">
      <stop offset="0" stop-color="#5EA0FA"/>
      <stop offset="1" stop-color="#3C81F3"/>
    </linearGradient>
    <linearGradient id="g-focus" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="104">
      <stop offset="0" stop-color="#15418F"/>
      <stop offset="1" stop-color="#2459B8"/>
    </linearGradient>
    <linearGradient id="g-minimized" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="144">
      <stop offset="0" stop-color="#3576DF"/>
      <stop offset="1" stop-color="#2A5FC4"/>
    </linearGradient>
    <linearGradient id="g-attention" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="184">
      <stop offset="0" stop-color="#F5B041"/>
      <stop offset="1" stop-color="#D98012"/>
    </linearGradient>
    <linearGradient id="g-launcher-hover" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="224">
      <stop offset="0" stop-color="#5EA0FA"/>
      <stop offset="1" stop-color="#3C81F3"/>
    </linearGradient>
  </defs>
